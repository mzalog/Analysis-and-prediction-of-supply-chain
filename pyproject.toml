[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply_chain"
version = "0.1.0"
description = "Big Data Supply Chain Analytics"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.5.0",
    "pyarrow>=12.0.0",
    "pandera>=0.18.0",
    "networkx>=3.0.0",
    "torch>=2.0.0",
    "torch-geometric>=2.7.0",
    "tqdm>=4.65.0",
    "streamlit>=1.52.2",
    "pydeck>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = []

[tool.ruff.isort]
known-first-party = ["supply_chain"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    "src"
]
